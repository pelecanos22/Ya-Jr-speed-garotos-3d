 if(cool>0)return;cool=.22;impact=.52;for(let i=0;i<12;i++)particle(2);
 tone(99,35,.21,.21,0,'sawtooth');
 if(sound&&!muted){const {ctx,master,buf}=sound,t=ctx.currentTime,o=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.buffer=buf;f.type='lowpass';f.frequency.value=1050;g.gain.setValueAtTime(.32,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.19);}
}
function nearestTo(px,pz,hint){let best=hint,d=Infinity;for(let i=-24;i<=24;i++){const j=(hint+i+N)%N,p=points[j],dist=(px-p.x)**2+(pz-p.z)**2;if(dist<d){best=j;d=dist;}}return best;}
function laneAt(s,lat){const wrap=(s%N+N)%N,i=Math.floor(wrap),f=wrap-i,p=points[i],q=points[(i+1)%N];return{x:p.x+(q.x-p.x)*f+p.nx*lat,z:p.z+(q.z-p.z)*f+p.nz*lat,a:Math.atan2(p.tx,p.tz)};}
function playerPlace(s,lane){const p=laneAt(s,lane);x=p.x;z=p.z;heading=p.a;nearest=previous=(s+N)%N;velocity=vx=vz=steer=0;camReset=true;}
function setRig(index){removeCar(rig);rig=makeCar(cars[index],true);}
function resetRivals(){
 rivals.forEach(r=>removeCar(r.rig));rivals=[];
 const colors=[0xef4444,0xa855f7,0x3b82f6,0x10b981,0xf97316];
 for(let i=0;i<5;i++){const c=[...cars[i]];c[3]=colors[i];const lane=[4.6,-4.6,4.6,-4.6,4.6][i],s=[-4,-9,-9,-14,-14][i],p=laneAt(s,lane);rivals.push({s,lane,base:lane,speed:0,id:i,x:p.x,z:p.z,a:p.a,rig:makeCar(c)});}
}
function resetKeys(){for(const k in input)input[k]=false;}
function setGear(g,fx=true){g=clamp(g,1,5);if(g!==gear&&fx)tone(125,65,.08,.11,0,'square');gear=g;for(const b of $('gears').querySelectorAll('button'))b.setAttribute('aria-pressed',String(+b.dataset.gear===gear));}
function start(story=false){
 audio();storyRace=story;
 [track,pilot]=story?[chapters[chapter][2],chapters[chapter][3]]:[chosenTrack,chosenPilot];
 if(track<3){const keys=['urban','desert','mountains','forest'].filter(k=>k!==priorBiome);biome=keys[Math.floor(Math.random()*keys.length)];priorBiome=biome;}else biome=tracks[track][9];
 activeCar=cars.findIndex(c=>c[0]===save.selectedCar);setRig(activeCar);
 course();build();playerPlace(-4,-4.6);resetRivals();resetKeys();particles.forEach(p=>p.life=0);
 laps=elapsed=0;progress=-4;rank=1;armed=started=false;boost=100;boosting=drifting=false;impact=cool=0;countdown=5;lastBeep=6;setGear(1,false);
 $('circuit').textContent=tracks[track][1]+' · '+themes[biome][0]+' · '+pilots[pilot][0];
 mode='count';show();
}
function simulate(dt){
 elapsed+=dt;cool=Math.max(0,cool-dt);
 const c=cars[activeCar],p=pilots[pilot];
 boosting=!!(input.boost&&input.gas&&boost>1);
 boost=clamp(boost+(boosting?-28:12*p[5])*dt,0,100);
 const limit=(boosting?200:caps[gear])*U;
 if(input.brake)velocity-=68*dt;else if(input.gas)velocity+=c[5]*p[3]*(boosting?1.42*p[4]:1)*dt;else velocity*=Math.pow(.42,dt);
 if(velocity>limit)velocity+=(limit-velocity)*Math.min(1,dt*8);
 velocity=clamp(velocity,-14,68);
 const target=(Number(!!input.left)-Number(!!input.right))*.72;
 const pad=navigator.getGamepads?.()[0],axis=pad?.axes[0]||0;
 steer+=((Math.abs(axis)>.14?-axis*.72:target)-steer)*Math.min(1,dt*9.5);
 drifting=(input.drift||Math.abs(steer)>.42)&&velocity>18;
 heading+=steer*c[6]*p[2]*(drifting?1.24:1)*Math.min(1,Math.abs(velocity)/16)*(velocity<0?-1:1)*dt;
 const grip=1-Math.pow(1-(drifting?c[7]:c[8]),dt*60);
 vx+=(Math.sin(heading)*velocity-vx)*grip;vz+=(Math.cos(heading)*velocity-vz)*grip;x+=vx*dt;z+=vz*dt;
 if((boosting||drifting)&&Math.random()<dt*44)particle(boosting?1:0);
 nearest=nearestTo(x,z,nearest);const q=points[nearest],lat=(x-q.x)*q.nx+(z-q.z)*q.nz;
 if(Math.abs(lat)>W-1.34){const s=Math.sign(lat);x=q.x+q.nx*s*(W-1.44);z=q.z+q.nz*s*(W-1.44);if(cool===0){velocity*=.83;vx*=.78;vz*=.78;crash();}}
 const forward=vx*q.tx+vz*q.tz>0;
 if(started&&nearest>N*.33&&nearest<N*.68)armed=true;
 if(previous>N*.86&&nearest<N*.14&&forward){if(!started)started=true;else if(armed){laps++;armed=false;tone(600,720,.12,.18);}}
 previous=nearest;progress=started?laps*N+nearest:nearest>N*.5?nearest-N:nearest;
 for(const r of rivals){
  if(r.s<2*N){r.speed=Math.min(23+(r.id%4)*3.4,r.speed+19*dt);r.s+=r.speed*dt*N/length;if(r.s>=2*N){r.s=2*N;r.finished=true;}}
  const desired=r.base+Math.sin(elapsed*.53+r.id*1.5)*1.38;
  r.lane+=(desired-r.lane)*dt*1.8;
  const p=laneAt(r.s,r.lane);r.x=p.x;r.z=p.z;r.a=p.a;
  const dx=x-r.x,dz=z-r.z,d=Math.hypot(dx,dz);
  if(!r.finished&&d<2.65&&cool===0){x+=dx*.2;z+=dz*.2;velocity*=.84;crash();}
 }
 rank=1+rivals.filter(r=>r.finished||r.s>progress).length;
 if(laps>=2)finish();
}
function timeText(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${(Math.floor(s%60*10)/10).toFixed(1).padStart(4,'0')}`;}
let reward=0;
function finish(){
 mode='finish';resetKeys();reward=[0,450,220,160,120,90,70][rank]+(storyRace?chapters[chapter][1]:0);save.coins+=reward;if(storyRace)save.storyCompleted[chapter]=true;persist();
 [523,659,784,1047].forEach((f,i)=>tone(f,f,.12,.34,i*.1));show();
}
const action=(name,label,primary=false)=>`<button type="button" data-act="${name}"${primary?' class="primary"':''}>${label}</button>`;
const opt=(name,label,pressed)=>`<button type="button" data-act="${name}" aria-pressed="${pressed}">${label}</button>`;
const money=()=>`<span class="money">$${save.coins}</span>`;
let helpBack='menu',garageNotice='';
function show(focus=true){
 const play=mode==='race'||mode==='count';
 $('screen').hidden=play;$('hud').hidden=mode!=='race';$('count').hidden=mode!=='count';
 if(play){if(mode==='race'&&focus)$('pause').focus({preventScroll:true});return;}
 const p=$('panel');$('screen').dataset.mode=mode;p.className='panel'+(mode==='menu'?' main':mode==='garage'?' garage':'');let html='';const stripScroll=p.querySelector('.vehicle-strip')?.scrollLeft||0;
 if(mode==='menu')html=`<nav class="menu" aria-label="Menu principal">${action('setup','Corrida',true)}${action('garage','Garagem')}${action('shop','Loja')}${action('story','História')}${action('help','Controles')}</nav><header class="menu-title"><p class="tag">Underground Edition · ${money()}</p><h1>YA JR SPEED <em>2</em><br>GAROTOS</h1><p>Veículo atual: <b>${cars[activeCar][1]}</b></p></header>`;
 if(mode==='setup')html=`<p class="tag">Preparação · 2 voltas · 6 carros</p><h2>Pista e piloto</h2><p class="tag">01 / Escolha o circuito</p><div class="choices">${tracks.map((t,i)=>opt('track'+i,`<small>CIRCUITO 0${i+1}</small>${t[1]}`,chosenTrack===i)).join('')}</div><p>${tracks[chosenTrack][2]} ${chosenTrack<3?'Cenário sorteado: Noturno Urbano, Deserto, Montanhas ou Florestas.':`Cenário: ${themes[tracks[chosenTrack][9]][0]}.`}</p><p class="tag">02 / Escolha o piloto</p><div class="choices">${pilots.map((t,i)=>opt('pilot'+i,t[0],chosenPilot===i)).join('')}</div><p>${pilots[chosenPilot][1]}</p><div class="row footer">${action('menu','Menu')}${action('help','Controles')}${action('start','Iniciar corrida (5 s)',true)}</div>`;
 if(mode==='garage'){
  const c=cars[preview],owned=save.unlocked[c[0]],eq=c[0]===save.selectedCar;
  html=`<header class="garage-head"><p class="tag">Garagem · ${money()} · ${preview+1}/${cars.length}</p><h2>${c[1]}</h2><p>${c[11]} · 150 / 200 KM/H</p></header><section class="garage-dock" aria-label="Seleção de veículos"><div class="vehicle-strip" role="group" aria-label="Veículos da garagem">${cars.map((a,i)=>opt('car'+i,`${a[1]}<small>${save.selectedCar===a[0]?'Equipado':save.unlocked[a[0]]?'Comprado':'$'+a[2]}</small>`,preview===i)).join('')}</div><p role="status">${garageNotice}</p><div class="row footer">${action('menu','Menu')}${eq?'<button disabled>Equipado</button>':action('buy',owned?'Equipar':'Comprar ($'+c[2]+')')}${action('setup','Correr',true)}</div></section>`;
 }
 if(mode==='story'){
  const c=chapters[chapter],l=c[5][line];html=`<p class="tag">História · Capítulo ${chapter+1}/3 · +$${c[1]}${save.storyCompleted[chapter]?' · Concluído':''}</p><h2>${c[0]}</h2><div class="row">${chapters.map((_,i)=>opt('chapter'+i,'Capítulo '+(i+1),i===chapter)).join('')}</div><p>${c[4]}</p><div class="glass"><div class="tag">${l[0]} · ${line+1}/${c[5].length}</div><p>${l[1]}</p></div><p>Objetivo: complete as 2 voltas do capítulo.</p><div class="row footer">${action('menu','Menu')}${action('skip','Pular cutscene')}${action('next',line===c[5].length-1?'Rever falas':'Próximo →')}${action('storyStart','Correr capítulo (5 s)',true)}</div>`;
 }
 if(mode==='shop')html=`<p class="tag">YA JR SPEED GAROTOS 2</p><h2>Loja</h2><p>Em breve — nenhum item disponível no momento. Use suas moedas na garagem para desbloquear carros.</p>${action('menu','Voltar')}`;
 if(mode==='pause')html=`<p class="tag">${tracks[track][1]}</p><h2>Corrida pausada</h2><div class="row">${action('resume','Continuar',true)}${action('again','Reiniciar')}${action('garage','Garagem')}${action('menu','Menu')}${action('help','Controles')}</div>`;
 if(mode==='help')html=`<h2>Controles</h2><p><b>WASD ou setas:</b> acelerar, frear e virar.<br><b>Q / E ou 1–5:</b> trocar de marcha.<br><b>Espaço:</b> nitro enquanto acelera. <b>Shift:</b> drift.<br><b>C:</b> câmera. <b>M:</b> som. <b>Esc:</b> pausar ou voltar.</p><p>No celular, segure os botões de direção e aceleração. Use as marchas na tela para aumentar o limite de velocidade.</p>${action('helpBack','Voltar',true)}`;
 if(mode==='finish')html=`<p class="tag">${storyRace?'Capítulo concluído':'Corrida concluída'} · 2 voltas</p><h2>${rank===1?'1º lugar · Vencedor!':rank+'º lugar'}</h2><p>${tracks[track][1]} · ${timeText(elapsed)} · <span class="money">+$${reward}</span></p><p>Saldo atual: ${money()}</p><div class="row footer">${action('garage','Garagem')}${action('menu','Menu')}${action('again','Correr novamente',true)}</div>`;
 p.innerHTML=html;const strip=p.querySelector('.vehicle-strip'),selected=strip?.querySelector('[aria-pressed=true]');if(selected){strip.scrollLeft=stripScroll;const a=selected.getBoundingClientRect(),b=strip.getBoundingClientRect();if(a.left<b.left)strip.scrollLeft+=a.left-b.left-5;else if(a.right>b.right)strip.scrollLeft+=a.right-b.right+5;}if(focus)(selected||p.querySelector('button'))?.focus({preventScroll:true});
}
function previewTrack(){
 track=chosenTrack;biome=tracks[track][9];course();build();playerPlace(0,0);rivals.forEach(r=>removeCar(r.rig));rivals=[];setRig(activeCar);
}
function pause(){if(mode!=='race'&&mode!=='count')return;pausedFrom=mode;mode='pause';resetKeys();show();}
function activate(a){
 audio();
 if(a==='start'||a==='storyStart'||a==='again'){start(a==='storyStart'||(a==='again'&&storyRace));return;}
 if(a==='resume'){mode=pausedFrom;show();return;}
 if(a==='help'){helpBack=mode;mode='help';show();return;}
 if(a==='helpBack'){mode=helpBack;show();return;}
 if(a.startsWith('track')){chosenTrack=+a.slice(5);previewTrack();}
 else if(a.startsWith('pilot'))chosenPilot=+a.slice(5);
 else if(/^car\d$/.test(a)){preview=+a.slice(3);garageNotice='';setRig(preview);}
 else if(a.startsWith('chapter')){chapter=+a.slice(7);line=0;}
 else if(a==='next')line=(line+1)%chapters[chapter][5].length;
 else if(a==='skip')line=chapters[chapter][5].length-1;
 else if(a==='buy'){
  const c=cars[preview];if(save.unlocked[c[0]]||save.coins>=c[2]){
   if(!save.unlocked[c[0]]){save.coins-=c[2];save.unlocked[c[0]]=true;}
   save.selectedCar=c[0];activeCar=preview;persist();garageNotice=c[1]+' equipado!';
  }else garageNotice='Moedas insuficientes. Você precisa de $'+c[2]+'.';
 }
 else if(['menu','setup','garage','shop','story'].includes(a)){
  if(a==='menu'||a==='setup'||a==='garage'){previewTrack();preview=activeCar;garageNotice='';}
  mode=a;show();return;
 }
 show(false);$('panel').querySelector(`[data-act="${a}"]`)?.focus({preventScroll:true});
}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)activate(b.dataset.act);});
$('gears').innerHTML=caps.slice(1).map((_,i)=>`<button data-gear="${i+1}" aria-label="Marcha ${i+1}">${i+1}</button>`).join('');
$('gears').addEventListener('click',e=>{if(e.target.dataset.gear){audio();setGear(+e.target.dataset.gear);}});
$('pause').addEventListener('click',pause);
$('camera').addEventListener('click',()=>{far=!far;$('camera').textContent=far?'Câm. distante':'Câmera';});
$('mute').addEventListener('click',()=>{audio();muted=!muted;$('mute').textContent=muted?'Sem som':'Som';$('mute').setAttribute('aria-pressed',String(muted));if(sound)sound.master.gain.setTargetAtTime(muted?0:.55,sound.ctx.currentTime,.04);});
const keys={KeyW:'gas',ArrowUp:'gas',KeyS:'brake',ArrowDown:'brake',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'boost',ShiftLeft:'drift',ShiftRight:'drift'};
addEventListener('keydown',e=>{
 if(e.code==='Escape'){if(mode==='race'||mode==='count')pause();else if(mode==='pause')activate('resume');else if(mode==='help')activate('helpBack');else if(mode!=='menu')activate('menu');return;}
 if(mode!=='race'&&mode!=='count'){
  if(e.code==='Enter'&&!e.target.closest?.('button')){if(mode==='menu'||mode==='garage')activate('setup');else if(mode==='setup')activate('start');}
  if(mode==='garage'&&['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)){e.preventDefault();activate('car'+((preview+(['ArrowLeft','KeyA'].includes(e.code)?cars.length-1:1))%cars.length));}
  return;
 }
 if(keys[e.code]){
  if(e.code==='Space'&&e.target.closest?.('button')&&e.target!==$('pause'))return;
  e.preventDefault();audio();input[keys[e.code]]=true;
 }
 if(e.repeat)return;
 if(/^Digit[1-5]$/.test(e.code))setGear(+e.code.at(-1));if(e.code==='KeyQ')setGear(gear-1);if(e.code==='KeyE')setGear(gear+1);if(e.code==='KeyC')$('camera').click();if(e.code==='KeyM')$('mute').click();
});
addEventListener('keyup',e=>{if(keys[e.code])input[keys[e.code]]=false;});
addEventListener('blur',()=>{resetKeys();if(mode==='race'||mode==='count')pause();});
document.querySelectorAll('[data-hold]').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();audio();b.setPointerCapture(e.pointerId);input[b.dataset.hold]=true;});
 for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{input[b.dataset.hold]=false;});
});
const map=$('map').getContext('2d'),look=new THREE.Vector3(),want=new THREE.Vector3();
function minimap(){
 map.clearRect(0,0,250,180);map.lineWidth=11;map.strokeStyle='#60718a';map.stroke(mapPath);map.lineWidth=3;map.strokeStyle='#c0cfdf';map.stroke(mapPath);
 function dot(px,pz,color,r){map.fillStyle=color;map.beginPath();map.arc(125+(px-mapCX)*mapScale,90+(pz-mapCZ)*mapScale,r,0,TAU);map.fill();}
 dot(points[0].x,points[0].z,'#fff',4);rivals.forEach(r=>dot(r.x,r.z,'#ff9b7e',4));dot(x,z,'#85f4dd',7);
}
function pose(r,px,pz,a,s,dt,player=false){
 r.root.position.set(px,0,pz);r.root.rotation.y=a;
 if(player){r.body.rotation.z=-steer*Math.min(.095,Math.abs(s)*.003);r.body.rotation.x=input.brake?.035:boosting?-.033:0;r.jets.forEach((j,i)=>{j.visible=mode==='race'&&boosting;j.scale.y=reduced?1:1+Math.sin(elapsed*37+i)*.22;});}
 for(const w of r.wheels){w.spin.rotation.x+=s*dt/.43;if(player&&w.z>0)w.p.rotation.y=steer*.45;}
}
let last=0,orbit=.55,displayAngle=.65;
function render(now){
 const dt=last?Math.min(.05,Math.max(0,(now-last)/1000)):0;last=now;
 if(mode==='count'){
  countdown-=dt;const n=Math.ceil(countdown);
  if(n!==lastBeep&&n>=0){lastBeep=n;if(n>0)tone(440,430,.13,.16);else{tone(760,900,.17,.28);tone(1140,1250,.08,.24,.05);}}
  $('count').innerHTML=`${n>0?n:'LARGADA!'}<small>${tracks[track][1]} · ${themes[biome][0]} · 6 CARROS · 2 VOLTAS</small>`;
  if(countdown<=-.35){mode='race';camReset=true;show(false);}
 }else if(mode==='race')simulate(dt);
 const playing=['race','count','pause','finish'].includes(mode)||(mode==='help'&&helpBack==='pause');
 if(!playing)orbit+=reduced?0:dt*.24;
 const showroom=mode==='garage';
 if(showroom&&!reduced)displayAngle=(displayAngle+dt*.26)%TAU;
 pose(rig,x,z,showroom?heading+displayAngle:playing?heading:heading+.5,mode==='race'?velocity:0,dt,true);
 for(const r of rivals){pose(r.rig,r.x,r.z,r.a,r.finished||mode!=='race'?0:r.speed,dt);r.rig.root.visible=!r.finished;}
 if(mode!=='pause')drawParticles(dt);
 if(mode==='count'){
  const p=points[0];want.set(p.x+p.tx*16+p.nx*12,7,p.z+p.tz*16+p.nz*12);look.set(p.x-p.tx*8,1,p.z-p.tz*8);
 }else if(showroom){
  const a=heading+.85,d=Math.max(7.6,5.3/camera.aspect);want.set(x+Math.sin(a)*d,2.75,z+Math.cos(a)*d);look.set(x,1.08,z);
 }else if(playing){
  const d=(far?13:8.5)+(camera.aspect<.8?2:0);
  want.set(x-Math.sin(heading)*d,far?5.4:3.7,z-Math.cos(heading)*d);look.set(x+Math.sin(heading)*5,.9,z+Math.cos(heading)*5);
 }else{
  const a=heading+orbit,d=camera.aspect<.8?9:7.2;
  want.set(x+Math.sin(a)*d,2.45,z+Math.cos(a)*d);look.set(x,1,z);
  if(mode==='menu'){const shift=Math.min(2.4,camera.aspect*1.5);look.x-=Math.cos(a)*shift;look.z+=Math.sin(a)*shift;}else if(camera.aspect>1.28){look.x+=Math.cos(a)*2.4;look.z-=Math.sin(a)*2.4;}
 }
 if(camReset){camera.position.copy(want);camReset=false;}else camera.position.lerp(want,1-Math.exp(-dt*8));
 camera.lookAt(look);
 const fov=boosting&&!reduced?68:60;
 if(Math.abs(camera.fov-fov)>.1){camera.fov+=(fov-camera.fov)*Math.min(1,dt*6);camera.updateProjectionMatrix();}
 sun.target.position.set(x,0,z);sun.position.set(x+32,64,z+23);
 impact=Math.max(0,impact-dt*2.5);$('impact').style.opacity=reduced?0:impact;
 if(mode==='race'){
  $('stats').textContent=`VOLTA ${Math.min(2,laps+1)}/2  ·  POS ${rank}º/6  ·  ${timeText(elapsed)}  ·  $${save.coins}`;
  $('kmh').textContent=Math.min(boosting?200:caps[gear],Math.round(Math.abs(velocity)/U));$('nitro').value=boost;$('nitroLabel').textContent=`NITRO ${Math.round(boost)}%`;minimap();
 }
 soundFrame();renderer.render(scene,camera);
}
previewTrack();setGear(1,false);show(false);renderer.setAnimationLoop(render);
}
